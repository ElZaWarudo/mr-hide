name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install uv
        run: python -m pip install "uv==0.11.31"
      - name: Sync locked environment
        run: python -m uv sync --locked --all-extras
      - name: Run local release-readiness gate
        run: python -m uv run --locked python scripts/check_release_readiness.py

  nlp-models:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==0.11.31"
      - name: Sync locked environment
        run: python -m uv sync --locked --all-extras
      - name: Install exact English and Spanish models
        run: >-
          python -m uv pip install
          https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl
      - name: Verify local bilingual detection
        run: python -m uv run --locked python -m pytest tests/integration/test_presidio_models.py -m nlp_models

  system-keyring-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==0.11.31"
      - name: Verify Windows Credential Locker
        run: python -m uv run --locked --all-extras python -m pytest tests/integration/test_system_keyring.py -m system_keyring

  system-keyring-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install Secret Service runtime
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 gnome-keyring
      - name: Install uv
        run: python -m pip install "uv==0.11.31"
      - name: Verify isolated Secret Service
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "test-password\n" | gnome-keyring-daemon --unlock
            python -m uv run --locked --all-extras python -m pytest tests/integration/test_system_keyring.py -m system_keyring
          '
